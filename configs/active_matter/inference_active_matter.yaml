# ─────────────────────────────────────────────────────────────────────────────
# configs/active_matter/inference_active_matter.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── Paths ─────────────────────────────────────────────────────────────────────
project_root:    "/glade/work/gaccarino/waveletflux"
well_base_path:  "/glade/work/gaccarino/data/datasets"
well_dataset_name: "active_matter"

# ── Checkpoint ────────────────────────────────────────────────────────────────
# Uncomment the checkpoint you want to evaluate
#ckpt_name: "WaveletFlow_active_matter_3scales_db2_v1.0_20260410_130543-epoch=198-val_loss=0.0102_portable.ckpt"
#ckpt_name: "WaveletFlow_active_matter_1scale_db2_v1.0_20260410_212850-epoch=185-val_loss=0.0078_portable.ckpt"
ckpt_name: "FM_data_space_active_matter_v1.0_20260410_214008-epoch=196-val_loss=0.0031_portable.ckpt"


# ── Dataset ───────────────────────────────────────────────────────────────────
split:     "test"
steps:     -1           # -1 = use all steps in each trajectory
transform: []
augment:   []

# ── Model / inference ─────────────────────────────────────────────────────────
n_steps_input:      4    # Ti — must match the value used during training
num_sampling_steps: 20   # ODE integration steps per prediction
n_ensemble:         8    # total ensemble members (split across GPUs)
verbose:            true
