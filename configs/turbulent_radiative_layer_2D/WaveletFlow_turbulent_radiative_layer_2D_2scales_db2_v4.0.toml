[main]
    exp_name   = 'WaveletFlow_turbulent_radiative_layer_2D_2scales_db2_v4.0'

[resume]
    ckpt = ''

[path]
    project_path      = '/glade/work/gaccarino/wavelet_flow_matching'
    well_base_path    = '/glade/work/gaccarino/data/datasets'
    well_dataset_name = 'turbulent_radiative_layer_2D'
    stats_path        = '/glade/work/gaccarino/data/datasets/turbulent_radiative_layer_2D/stats.yaml'
    experiments_path  = '/glade/work/gaccarino/wavelet_flow_matching/experiments/turbulent_radiative_layer_2D'

[random]
    seed = 4788

[train]
    epochs            = 200
    warmup_epochs     = 20
    batch_size        = 32
    n_steps_input     = 4
    n_steps_output    = 1
    max_rollout_steps = 1
    train_shuffle     = true
    val_shuffle       = false
    test_shuffle      = false
    rollout_shuffle   = false
    target_dtype      = 'torch.float32'
    augmentations     = []                  # stochastic: random_axis_flip, etc. — train only
    transformations   = []                  # deterministic: applied to ALL splits

[wavelet]
    cls         = 'WaveletDecomposer2D'
    use_wavelet = true
    n_coeff_mat = 4

[wavelet.params]
    wavelet  = 'db2'
    mode     = 'periodic'
    n_scales = 2

[velocity_net]
    cls = 'WaveletFlowUNet'
    [velocity_net.params]
        # conditioning / context
        num_cond            = 1
        context_in_channels = 4   # physical fields
        num_context_frames  = 3   # number of previous frames to condition on
        # architecture
        n_levels = 3              # number of wavelet scales (must >= wavelet.params.n_scales)
        base_ch  = 56
        n_res    = 3
        cond_dim = 256

[flow_matching]
    cls        = 'OT_CFM'
    n_ensemble = 1   # M realizations for the end-of-epoch monitoring sample only (no effect on the loss); inference M is set in inference_*.yaml

[flow_matching.params]
    sigma = 0.0

[loss]
    # must have exactly wavelet.params.n_scales entries
    scale_weights   = [1.0, 1.0]

[sampling]
    solver             = 'euler'
    num_sampling_steps = 20

[optimizer]
    cls = 'AdamW'
    [optimizer.params]
        lr           = 3e-4
        weight_decay = 1e-2
        betas        = [0.9, 0.999]

[scheduler]
    cls = 'CosineAnnealingLR'

[scheduler.params]
    eta_min = 1e-7

[lightning]
    [lightning.datamodules]
        data_workers = 16

    [lightning.trainer]
        accelerator         = 'gpu'
        strategy            = 'ddp'
        precision           = 'bf16-mixed' #'32-true'
        matmul_precision    = 'high'
        gradient_clip_val   = 1.0
        log_every_n_steps   = 1
        limit_train_batches = 1.0
        limit_val_batches   = 1.0

[loggers]
    loggers            = ['csv']
    log_every_n_epochs = 5

[callbacks]
    callbacks = ['model_checkpoint_cb', 'emergency_cb', 'performance_cb']